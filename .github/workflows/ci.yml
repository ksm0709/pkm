name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: cli
        run: |
          uv venv
          uv pip install -e ".[search,dev]"

      - name: Run tests
        working-directory: cli
        run: uv run pytest tests/ -v

      - name: Build and smoke distribution artifacts
        working-directory: cli
        run: |
          uv build --out-dir dist
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/pkm-*.whl 'aiohttp>=3.9'
          .wheel-smoke/bin/pkm --help
          .wheel-smoke/bin/python -c "import pkm.mcp_server; import pkm.web.server"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: web-frontend
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types
        working-directory: web-frontend
        run: pnpm exec svelte-kit sync

      - name: Check frontend formatting
        working-directory: web-frontend
        run: pnpm format:check

      - name: Run frontend unit tests
        working-directory: web-frontend
        run: pnpm test:unit

      - name: Build frontend
        working-directory: web-frontend
        run: pnpm build

      - name: Check frontend bundle budget
        working-directory: web-frontend
        run: pnpm bundle:check

      - name: Install Playwright Chromium
        working-directory: web-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused browser regressions
        working-directory: web-frontend
        run: |
          pnpm exec playwright test \
            tests/playwright/annotation-reanchor.spec.ts \
            tests/playwright/phase-b-retirement.spec.ts \
            tests/playwright/a11y.spec.ts \
            tests/playwright/graph-page.spec.ts \
            tests/playwright/routing-events.generated.spec.ts
          pnpm exec playwright test \
            tests/playwright/cmdk-shell.spec.ts \
            --grep "falls back to notes list"
