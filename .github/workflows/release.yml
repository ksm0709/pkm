name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.10 3.12

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: web-frontend
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types
        working-directory: web-frontend
        run: pnpm exec svelte-kit sync

      - name: Check frontend formatting
        working-directory: web-frontend
        run: pnpm format:check

      - name: Run frontend unit tests
        working-directory: web-frontend
        run: pnpm test:unit

      - name: Build web frontend
        working-directory: web-frontend
        run: pnpm build

      - name: Check frontend bundle budget
        working-directory: web-frontend
        run: pnpm bundle:check

      - name: Install Playwright Chromium
        working-directory: web-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused browser regressions
        working-directory: web-frontend
        run: |
          pnpm exec playwright test \
            tests/playwright/annotation-reanchor.spec.ts \
            tests/playwright/phase-b-retirement.spec.ts \
            tests/playwright/a11y.spec.ts \
            tests/playwright/graph-page.spec.ts \
            tests/playwright/routing-events.generated.spec.ts
          pnpm exec playwright test \
            tests/playwright/cmdk-shell.spec.ts \
            --grep "falls back to notes list"

      - name: Run CLI tests
        working-directory: cli
        run: |
          uv run --python 3.10 --extra dev --extra search pytest tests/ -v
          uv run --python 3.12 --extra dev --extra search pytest tests/ -v

      - name: Build and smoke distribution artifacts
        working-directory: cli
        run: |
          uv build --out-dir dist
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/pkm-*.whl 'aiohttp>=3.9'
          .wheel-smoke/bin/pkm --help
          .wheel-smoke/bin/python -c "import pkm.mcp_server; import pkm.web.server"

      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          pip install python-semantic-release
          semantic-release -c .semantic-release.toml version
          semantic-release -c .semantic-release.toml publish
